<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>სათბურია</title>
<meta name="description" content="სათბურია: ჭკვიანი სათბურის მართვა ტელეფონიდან">
<!-- installable on iPhone: Safari → Share → Add to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="სათბურია">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141d17" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;700&family=Noto+Serif+Georgian:wght@800&display=swap">
<style>
  /* Layout: phone app (slim header, scrolling screen, 4-tab bar). Home = a live drawing of the greenhouse + three readings + device buttons. */
  :root {
    --page: #e7ede3; --bg: #f4f7f1; --surface: #ffffff; --surface-2: #eef3ea;
    --ink: #15231a; --muted: #67776b; --line: #dde5d8;
    --leaf: #2f6b3a; --leaf-ink: #f4f8ef; --leaf-soft: #e1eedc;
    --sun: #e08b1e; --ok: #2f8a4c; --warn: #c6851a; --crit: #c0392b;
    --band: rgba(47, 107, 58, .12);
    /* drawing */
    --sky-1: #cfe6f2; --sky-2: #eef6ec; --hill: #b9d5a4; --ground: #8fb46a; --soil: #6b4a32;
    --frame: #9aa7a0; --glass: rgba(220, 240, 235, .45); --plant: #3f8a3c; --plant-2: #5fa646;
    --serif: "Noto Serif Georgian", "Sylfaen", Georgia, serif;
    --sans: "Noto Sans Georgian", "Sylfaen", system-ui, sans-serif;
    --r: 16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0b110d; --bg: #101813; --surface: #18231b; --surface-2: #1e2b21; --ink: #e6efe7; --muted: #9aab9d;
      --line: #2a382d; --leaf: #74c283; --leaf-ink: #0d1a10; --leaf-soft: #20352a; --sun: #f0a94a;
      --ok: #6fd18e; --warn: #f0b25a; --crit: #ff7a6b; --band: rgba(116, 194, 131, .14);
      --sky-1: #12233a; --sky-2: #1c2f3c; --hill: #22382a; --ground: #2b4527; --soil: #4a3426;
      --frame: #7d8a84; --glass: rgba(170, 210, 200, .14); --plant: #3c7a3a; --plant-2: #4f9441;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--page); color: var(--ink); font: 400 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

  /* ---------- device (phone frame only for desktop preview) ---------- */
  .stage { height: 100%; display: grid; place-items: center; padding-block: 24px; }
  .device {
    width: 375px; height: min(812px, calc(100vh - 48px)); position: relative; overflow: hidden;
    background: var(--bg); border-radius: 46px; border: 10px solid #121a15; box-shadow: 0 30px 80px rgba(10, 30, 15, .28);
    display: grid; grid-template-rows: auto 1fr auto;
  }
  @media (max-width: 520px), (display-mode: standalone) {
    body { background: var(--bg); }
    .stage { display: block; padding: 0; }
    .device { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
  }

  /* ---------- header ---------- */
  .top {
    padding: calc(env(safe-area-inset-top, 0px) + 8px) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; gap: 10px;
  }
  .device:not(.full) .top { padding-top: 32px; }
  .gh-btn { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; font: 800 22px/1.1 var(--serif); }
  .gh-btn svg { width: 18px; height: 18px; color: var(--muted); }
  .live { margin-left: auto; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }

  /* ---------- screens ---------- */
  main { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .screen { padding: 4px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
  .screen h1 { margin: 6px 0 0; font: 800 24px/1.2 var(--serif); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }

  /* the greenhouse drawing */
  .scene { position: relative; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
  .scene svg { display: block; width: 100%; height: auto; }
  .pill { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px;
    background: color-mix(in srgb, var(--surface) 88%, transparent); font-size: 13px; font-weight: 500; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .pill.alarm i { background: var(--crit); }
  .hot { cursor: pointer; }
  .blades { transform-box: fill-box; transform-origin: center; animation: spin var(--spd, 0s) linear infinite; }
  .blades.off { animation: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .drop { animation: fall 1s linear infinite; }
  @keyframes fall { from { transform: translateY(-4px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(14px); opacity: 0; } }
  .wave { animation: rise 2.4s ease-in-out infinite; }
  @keyframes rise { from { transform: translateY(6px); opacity: 0; } 40% { opacity: .9; } to { transform: translateY(-16px); opacity: 0; } }
  .air { animation: out 1.6s ease-out infinite; }
  @keyframes out { from { transform: translateY(0); opacity: 0; } 30% { opacity: .9; } to { transform: translateY(-12px); opacity: 0; } }
  .vent-g, .roll { transition: transform .6s ease; }

  /* three readings */
  .reads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .read { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 10px; display: grid; justify-items: center; gap: 2px; text-align: center; }
  .read svg { width: 22px; height: 22px; color: var(--muted); }
  .read b { font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .read b small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .read span { font-size: 12px; color: var(--muted); }
  .read.bad b { color: var(--crit); }

  /* device buttons */
  .devs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .dv { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 2px 8px; display: grid; justify-items: center; gap: 4px; }
  .dv svg { width: 26px; height: 26px; color: var(--muted); }
  .dv b { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
  .dv.on { background: var(--leaf-soft); border-color: transparent; }
  .dv.on svg, .dv.on b { color: var(--leaf); }
  .dv .m { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .dv .m.man { background: var(--sun); }   /* manual control marker */
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin: -6px 0 0; }

  /* ---------- history ---------- */
  .seg { display: flex; padding: 3px; border-radius: 12px; background: var(--surface-2); gap: 2px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 9px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font: 10px var(--sans); font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .stats div { background: var(--surface-2); border-radius: 12px; padding: 8px; text-align: center; }
  .stats b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 11px; color: var(--muted); }

  /* ---------- alerts ---------- */
  .alert { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  .sev { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
  .sev svg { width: 20px; height: 20px; }
  .sev.crit { background: color-mix(in srgb, var(--crit) 15%, transparent); color: var(--crit); }
  .sev.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .sev.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .alert b { display: block; font-size: 14.5px; }
  .alert span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .alert time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- settings ---------- */
  .group-h { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; margin: 4px 4px -8px; }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 0; border-bottom: 1px solid var(--line); min-height: 52px; width: 100%; background: none; text-align: left; }
  .row:last-child { border-bottom: 0; }
  .row .k { flex: 1; font-size: 15px; }
  .row .chk { width: 22px; height: 22px; color: var(--leaf); visibility: hidden; }
  .row[aria-checked="true"] .chk { visibility: visible; }
  .switch { width: 50px; height: 30px; border-radius: 15px; border: 0; padding: 0; background: var(--line); position: relative; flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .switch[aria-checked="true"] { background: var(--ok); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }

  /* ---------- tab bar ---------- */
  nav.tabs {
    display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(6px, env(safe-area-inset-left, 0px));
  }
  .device:not(.full) nav.tabs { padding-bottom: 22px; }
  .tab { border: 0; background: none; display: grid; justify-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: 11px; position: relative; }
  .tab svg { width: 25px; height: 25px; }
  .tab[aria-selected="true"] { color: var(--leaf); font-weight: 500; }
  .badge { position: absolute; top: 0; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

  /* ---------- bottom sheet ---------- */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 20px); display: grid; gap: 14px; animation: up .25s ease;
  }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
  .sh-top { display: flex; align-items: center; gap: 12px; }
  .sh-top .ic { width: 44px; height: 44px; border-radius: 14px; background: var(--leaf-soft); color: var(--leaf); display: grid; place-items: center; }
  .sh-top .ic svg { width: 26px; height: 26px; }
  .sh-top h2 { margin: 0; flex: 1; font-size: 18px; }
  .big { font-size: 44px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
  .big small { font-size: 20px; color: var(--muted); font-weight: 500; }
  input[type="range"] { width: 100%; height: 36px; margin: 0; accent-color: var(--leaf); }
  .btn { border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 500; font-size: 15px; background: var(--leaf); color: var(--leaf-ink); white-space: nowrap; }
  .btn.soft { background: var(--leaf-soft); color: var(--leaf); }
  .gh-opt { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-weight: 500; }
  .gh-opt[aria-checked="true"] { border-color: var(--leaf); background: var(--leaf-soft); }
  .gh-opt span { margin-left: auto; font-size: 13px; color: var(--muted); font-weight: 400; }
  @keyframes up { from { transform: translateY(100%); } }
  .toast { position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 30; background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 14px; text-align: center; animation: up .2s ease; }
  @media (prefers-reduced-motion: reduce) { .blades, .drop, .wave, .air, .sheet, .toast { animation: none !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="device" id="device">

    <header class="top">
      <button class="gh-btn" id="ghBtn" type="button" aria-haspopup="dialog"><span id="ghName">სათბური №1</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <span class="live" title="ონლაინ" aria-label="ონლაინ"></span>
    </header>

    <main id="main">
      <!-- HOME -->
      <section class="screen" id="s-home" aria-label="მთავარი">
        <div class="scene">
          <svg id="house" viewBox="0 0 340 220" role="img" aria-label="სათბურის მდგომარეობა"></svg>
          <span class="pill" id="pill"><i></i><span id="pillTxt">ყველაფერი რიგზეა</span></span>
        </div>
        <div class="reads" id="reads"></div>
        <div class="devs" id="devs"></div>
        <p class="hint">შეეხეთ მოწყობილობას სამართავად</p>
      </section>

      <!-- HISTORY -->
      <section class="screen" id="s-history" aria-label="ისტორია" hidden>
        <h1>ისტორია</h1>
        <div class="seg" role="group" aria-label="მაჩვენებელი" id="metricSeg">
          <button type="button" data-m="t" aria-pressed="true">ტემპერატურა</button>
          <button type="button" data-m="h" aria-pressed="false">ტენი</button>
          <button type="button" data-m="s" aria-pressed="false">ნიადაგი</button>
        </div>
        <div class="card">
          <svg class="chart" id="histChart" viewBox="0 0 340 190"></svg>
          <div class="stats" id="histStats"></div>
        </div>
        <div class="seg" role="group" aria-label="პერიოდი" id="rangeSeg">
          <button type="button" data-r="24" aria-pressed="true">24 სთ</button>
          <button type="button" data-r="7" aria-pressed="false">7 დღე</button>
          <button type="button" data-r="30" aria-pressed="false">30 დღე</button>
        </div>
      </section>

      <!-- ALERTS -->
      <section class="screen" id="s-alerts" aria-label="განგაში" hidden>
        <h1>განგაში</h1>
        <div id="alertList" style="display:grid;gap:10px"></div>
      </section>

      <!-- SETTINGS -->
      <section class="screen" id="s-settings" aria-label="პარამეტრები" hidden>
        <h1>პარამეტრები</h1>
        <div class="group-h">კულტურა</div>
        <div class="list" id="cropList" role="radiogroup" aria-label="კულტურა"></div>
        <div class="group-h">სათბური</div>
        <div class="seg" role="group" aria-label="სათბურის ტიპი" id="typeSeg">
          <button type="button" data-type="glass" aria-pressed="true">შუშის</button>
          <button type="button" data-type="film" aria-pressed="false">პარკის</button>
        </div>
        <div class="group-h">განგაში მოვიდეს</div>
        <div class="list">
          <div class="row"><span class="k">აპლიკაციაში</span><button class="switch" type="button" role="switch" aria-checked="true" aria-label="აპლიკაციაში"></button></div>
          <div class="row"><span class="k">SMS-ით</span><button class="switch" type="button" role="switch" aria-checked="true" aria-label="SMS-ით"></button></div>
          <div class="row"><span class="k">ზარით</span><button class="switch" type="button" role="switch" aria-checked="true" aria-label="ზარით"></button></div>
        </div>
      </section>
    </main>

    <nav class="tabs" role="tablist" aria-label="მენიუ">
      <button class="tab" role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20V10l8-6 8 6v10h-5v-6H9v6z"/></svg>მთავარი</button>
      <button class="tab" role="tab" data-tab="history" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="m7 14 4-4 3 3 5-6"/></svg>ისტორია</button>
      <button class="tab" role="tab" data-tab="alerts" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="badge">2</span>განგაში</button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>პარამეტრები</button>
    </nav>

    <div id="overlay"></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const device = $('device');
  const full = matchMedia('(max-width: 520px), (display-mode: standalone)');
  const syncFull = () => device.classList.toggle('full', full.matches || navigator.standalone === true);
  syncFull(); full.addEventListener?.('change', syncFull);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  /* ---------------- demo state ---------------- */
  const CROPS = {
    tomato:     { name: 'პომიდორი', day: [21, 27], night: [16, 18], rh: [60, 70], soil: [70, 80], h: 1, fruit: '#d6402b' },
    cucumber:   { name: 'კიტრი',    day: [24, 28], night: [18, 20], rh: [70, 85], soil: [80, 90], h: 1.15, fruit: '#3c6e2a' },
    pepper:     { name: 'წიწაკა',   day: [22, 27], night: [16, 18], rh: [60, 75], soil: [70, 80], h: .75, fruit: '#e8a21f' },
    strawberry: { name: 'მარწყვი',  day: [18, 24], night: [8, 12],  rh: [60, 75], soil: [70, 80], h: .35, fruit: '#d8262f' },
    greens:     { name: 'მწვანილი', day: [15, 20], night: [8, 12],  rh: [60, 70], soil: [65, 75], h: .3, fruit: null },
  };
  const GH = [
    { name: 'სათბური №1', crop: 'tomato', type: 'glass' },
    { name: 'სათბური №2', crop: 'strawberry', type: 'film' },
  ];
  const S = { gh: 0, crop: 'tomato', type: 'glass' };
  const crop = () => CROPS[S.crop];
  const DEV = {
    fan:   { name: 'ვენტილატორი', val: 40, auto: true },
    vent:  { name: 'ფანჯრები',    val: 30, auto: true },
    heat:  { name: 'გათბობა',     val: 24, auto: true, power: 0 },
    light: { name: 'განათება',    val: 0,  auto: true, color: 'warm' },
    water: { name: 'მორწყვა',     val: 0,  auto: true },
  };
  const reading = { t: 26.4, h: 63, s: 76 };   // a warm midday: fans and windows are working
  const ventName = () => (S.type === 'film' ? 'გვერდები' : 'ფანჯრები');
  const on = k => (k === 'heat' ? DEV.heat.power > 0 : DEV[k].val > 0);
  const short = k => {
    const d = DEV[k];
    if (k === 'heat') return d.val <= 4 ? 'გამორთ.' : `${d.val}°`;
    if (k === 'water') return d.val ? 'ირწყვება' : 'ავტო';

  /* ---------------- the greenhouse drawing (front view) ---------------- */
  function drawHouse() {

    const shell = film ? 'M40 190 V140 C40 52, 300 52, 300 140 V190 Z' : 'M40 190 V118 L170 58 L300 118 V190 Z';
    // plants: two beds, three plants each; height depends on the crop
    const plants = [];
    for (const bx of [118, 222]) for (const dx of [-26, 0, 26]) {

        <path d="M${x - 22} ${ridgeY + 35} L${x - 38} 168 H${x + 38} L${x + 22} ${ridgeY + 35} Z" fill="${lampCol}" opacity="${lamp * .28}"/>`).join('');
    const fan = (x, y) => `<g class="hot" data-dev="fan"><circle cx="${x}" cy="${y}" r="15" fill="var(--surface-2)" stroke="var(--frame)" stroke-width="2"/>

    // glass: two roof vents hinged at the ridge; film: roll-up side curtains
    const vents = film
      ? [40, 300].map(x => { const up = DEV.vent.val / 100 * 40;
          return `<g class="hot" data-dev="vent"><rect x="${x - 4}" y="140" width="8" height="${Math.max(2, 46 - up)}" fill="var(--glass)" stroke="var(--frame)" stroke-width="1"/>

          <g class="vent-g" style="transform: rotate(${ventA}deg); transform-origin: 172px 59px"><path d="M172 59 L222 82" stroke="var(--leaf)" stroke-width="6" stroke-linecap="round" opacity=".85"/></g>

      <rect width="340" height="220" fill="url(#sky)"/>

      ${lamps}
      <g class="hot" data-dev="light"><rect x="100" y="${ridgeY + 26}" width="140" height="14" fill="transparent"/></g>
      <rect x="88" y="178" width="60" height="10" rx="2" fill="var(--soil)"/><rect x="192" y="178" width="60" height="10" rx="2" fill="var(--soil)"/>
      <g class="hot" data-dev="water">${plants.join('')}<rect x="85" y="110" width="170" height="66" fill="transparent"/></g>
      ${drops}

        <path d="M70 186 H272" stroke="${heat ? '#ff7a3c' : 'var(--frame)'}" stroke-width="4" stroke-linecap="round" opacity="${heat ? .5 + heat * .5 : .6}"/>
        ${waves}<rect x="60" y="178" width="220" height="12" fill="transparent"/></g>
      ${fan(62, film ? 158 : 136)}${fan(278, film ? 158 : 136)}

  }

  /* ---------------- home ---------------- */
  function renderHome() {
    const c = crop();
    const items = [
      ['temp', reading.t.toFixed(1), '°C', 'ჰაერი', reading.t < c.night[0] || reading.t > c.day[1]],
      ['hum', reading.h, '%', 'ტენი', reading.h < c.rh[0] - 5 || reading.h > c.rh[1] + 10],

    $('reads').innerHTML = items.map(([ic, v, u, l, bad]) => `<button class="read ${bad ? 'bad' : ''}" type="button" data-go="history">${ICON[ic]}<b>${v}<small>${u}</small></b><span>${l}</span></button>`).join('');

    const bad = items.some(i => i[4]);
    $('pill').classList.toggle('alarm', bad);
    $('pillTxt').textContent = bad ? 'ყურადღება' : 'ყველაფერი რიგზეა';
    $('ghName').textContent = GH[S.gh].name;
    drawHouse();
  }

  /* ---------------- device sheet ---------------- */
  let sheetKey = null;
  function openDev(k) {
    const d = DEV[k], name = k === 'vent' ? ventName() : d.name;
    let body = '';
    if (k === 'water') body = `<button class="btn" type="button" id="waterBtn">${d.val ? 'შეჩერება' : 'მორწყვა ახლა · 10 წთ'}</button>`;
    else {
      const [mn, mx, st] = k === 'heat' ? [4, 35, 1] : [0, 100, 5];
      body = `<div class="big" id="big"></div><input type="range" id="rng" min="${mn}" max="${mx}" step="${st}" value="${d.val}" aria-label="${name}">`;
      if (k === 'light') body += `<div class="seg" role="group" aria-label="ფერი"><button type="button" data-color="warm" aria-pressed="${d.color === 'warm'}">თეთრი</button><button type="button" data-color="grow" aria-pressed="${d.color === 'grow'}">იისფერი</button></div>`;
    }
    $('overlay').innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-label="${name}">
      <span class="grab"></span>
      <div class="sh-top"><span class="ic">${ICON[k]}</span><h2>${name}</h2></div>
      <div class="seg" role="group" aria-label="რეჟიმი"><button type="button" data-mode="auto" aria-pressed="${d.auto}">ავტო</button><button type="button" data-mode="manual" aria-pressed="${!d.auto}">ხელით</button></div>
      ${body}
      <button class="btn soft" type="button" data-close>მზადაა</button></div>`;
    sheetKey = k; syncSheet();
  }
  function syncSheet() {
    const k = sheetKey; if (!k) return; const d = DEV[k], big = $('big');
    if (big) big.innerHTML = k === 'heat' ? (d.val <= 4 ? 'გამორთ.' : `${d.val}<small>°C</small>`) : `${d.val}<small>%</small>`;
    $('overlay').querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.mode === 'auto') === d.auto)));
  }
  $('overlay').addEventListener('input', e => {
    if (e.target.id !== 'rng') return;
    const d = DEV[sheetKey]; d.val = +e.target.value; d.auto = false;
    if (sheetKey === 'heat') d.power = d.val <= 4 ? 0 : Math.max(0, Math.min(100, Math.round((d.val - reading.t + .3) / 1.2 * 20) * 5));
    syncSheet(); renderHome();
  });
  $('overlay').addEventListener('click', e => {
    const m = e.target.closest('[data-mode]');
    if (m && sheetKey) { DEV[sheetKey].auto = m.dataset.mode === 'auto'; if (DEV[sheetKey].auto) autoLevels(); const r = $('rng'); if (r) r.value = DEV[sheetKey].val; syncSheet(); renderHome(); return; }
    const col = e.target.closest('[data-color]');
    if (col) { DEV.light.color = col.dataset.color; $('overlay').querySelectorAll('[data-color]').forEach(b => b.setAttribute('aria-pressed', String(b === col))); renderHome(); return; }
    if (e.target.id === 'waterBtn') { DEV.water.val = DEV.water.val ? 0 : 1; DEV.water.auto = !DEV.water.val; e.target.textContent = DEV.water.val ? 'შეჩერება' : 'მორწყვა ახლა · 10 წთ'; syncSheet(); renderHome(); return; }
    const g = e.target.closest('[data-gh]');
    if (g) { S.gh = +g.dataset.gh; S.crop = GH[S.gh].crop; S.type = GH[S.gh].type; autoLevels(); renderAll(); }
    if (g || e.target.closest('[data-close]')) { $('overlay').innerHTML = ''; sheetKey = null; }
  });
  // what automatic mode does in this demo moment (midday, slightly warm)
  function autoLevels() {
    const c = crop(), target = (c.day[0] + c.day[1]) / 2 + .5, t = reading.t;
    const lv = v => Math.max(0, Math.min(100, Math.round(v * 20) * 5));
    if (DEV.fan.auto) DEV.fan.val = lv((t - target - .3) / 3);
    if (DEV.vent.auto) DEV.vent.val = lv((t - target - .8) / 4);
    if (DEV.heat.auto) { DEV.heat.val = Math.round(target - .5); DEV.heat.power = lv((DEV.heat.val - t + .3) / 1.2); }
    if (DEV.light.auto) DEV.light.val = 0;
    if (DEV.water.auto) DEV.water.val = 0;
  }
  document.addEventListener('click', e => {
    const d = e.target.closest('[data-dev]');
    if (d && !e.target.closest('#overlay')) openDev(d.dataset.dev);
  });

  /* ---------------- history ---------------- */
  const hist = { m: 't', r: '24' };
  const NOW_H = 11, hours = Array.from({ length: 24 }, (_, i) => (NOW_H - 23 + i + 24) % 24);
  const isDay = h => h >= 6 && h < 20;
  function series() {
    const c = crop(), mN = (c.night[0] + c.night[1]) / 2, mD = (c.day[0] + c.day[1]) / 2;
    const t = hours.map((h, i) => +((isDay(h) ? mN + (mD + 1.5 - mN) * Math.max(0, Math.sin(Math.PI * (h - 6) / 14)) : mN - .4) + Math.sin(i * 1.7) * .4).toFixed(1));
    const hm = t.map((v, i) => Math.round(c.rh[1] + 2 - (v - c.night[0]) * .9 + Math.cos(i) * 1.5));
    let so = c.soil[0] + 4; const s = hours.map(h => { so -= .45; if (h === 7 || h === 15) so += 9; return Math.round(so); });
    return { t, h: hm, s };
  }
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };
  function chart(svg, vals, band, labels) {
    svg.innerHTML = '';
    const W = 340, H = 190, L = 30, R = 8, T = 10, B = 22;
    const bands = vals.map((_, i) => band(i)), all = vals.concat(...bands.flat());
    let mn = Math.floor(Math.min(...all) - 1), mx = Math.ceil(Math.max(...all) + 1);
    const step = (mx - mn) > 20 ? 10 : (mx - mn) > 8 ? 4 : 2;
    mn = Math.floor(mn / step) * step; mx = Math.ceil(mx / step) * step;
    const x = i => L + (i / (vals.length - 1)) * (W - L - R), y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
    for (let v = mn; v <= mx; v += step) {
      svg.append(el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: css('--line'), 'stroke-width': 1 }));
      const t = el('text', { x: L - 6, y: y(v) + 3, 'text-anchor': 'end' }); t.textContent = v; svg.append(t);
    }
    const top = [], bot = [];
    bands.forEach((b, i) => { const x0 = i ? (x(i - 1) + x(i)) / 2 : x(0), x1 = i === vals.length - 1 ? x(i) : (x(i) + x(i + 1)) / 2;
      top.push(`${x0},${y(b[1])}`, `${x1},${y(b[1])}`); bot.unshift(`${x1},${y(b[0])}`, `${x0},${y(b[0])}`); });
    svg.append(el('polygon', { points: top.concat(bot).join(' '), fill: css('--band') }));
    const pts = vals.map((v, i) => `${x(i)},${y(v)}`);
    svg.append(el('polyline', { points: pts.join(' '), fill: 'none', stroke: css('--leaf'), 'stroke-width': 2.4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    svg.append(el('circle', { cx: x(vals.length - 1), cy: y(vals[vals.length - 1]), r: 4.5, fill: css('--leaf'), stroke: css('--surface'), 'stroke-width': 2 }));
    labels.forEach(([i, txt]) => { const t = el('text', { x: x(i), y: H - 6, 'text-anchor': i === 0 ? 'start' : i === vals.length - 1 ? 'end' : 'middle' }); t.textContent = txt; svg.append(t); });
  }
  function renderHistory() {
    const c = crop(), D = series(), U = hist.m === 't' ? '°C' : '%';
    let vals, labels, band;
    if (hist.r === '24') {
      vals = D[hist.m];
      labels = [[0, `${hours[0]}:00`], [12, `${hours[12]}:00`], [23, 'ახლა']];
      band = i => (hist.m === 't' ? (isDay(hours[i]) ? c.day : c.night) : hist.m === 'h' ? c.rh : c.soil);
    } else {
      const n = hist.r === '7' ? 7 : 30, base = hist.m === 't' ? (c.day[0] + c.day[1]) / 2 - 1 : hist.m === 'h' ? (c.rh[0] + c.rh[1]) / 2 : (c.soil[0] + c.soil[1]) / 2;
      vals = Array.from({ length: n }, (_, i) => +(base + Math.sin(i * 1.3) * 1.6 + Math.cos(i * .7)).toFixed(1));
      labels = [[0, n === 7 ? '7 დღის წინ' : '30 დღის წინ'], [n - 1, 'დღეს']];
      band = () => (hist.m === 't' ? c.day : hist.m === 'h' ? c.rh : c.soil);
    }
    chart($('histChart'), vals, band, labels);
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    $('histStats').innerHTML = `<div><b>${Math.min(...vals)}${U}</b><span>მინ.</span></div><div><b>${avg.toFixed(1)}${U}</b><span>საშ.</span></div><div><b>${Math.max(...vals)}${U}</b><span>მაქს.</span></div>`;
  }
  function seg(id, key, fn) {
    $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
      $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); fn(b.dataset[key]); });
  }
  seg('metricSeg', 'm', v => { hist.m = v; renderHistory(); });
  seg('rangeSeg', 'r', v => { hist.r = v; renderHistory(); });

  /* ---------------- alerts ---------------- */
  const SEV = {
    crit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20Z"/><path d="M12 10v4M12 17v.5"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16v.5"/></svg>',
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 10"/></svg>',
  };
  const ALERTS = [
    ['crit', 'ყინვის საფრთხე', '15.8 °C · გათბობა ჩაირთო', '03:12'],
    ['ok', 'ტემპერატურა ნორმაშია', '17.2 °C', '05:40'],
    ['warn', 'ტენიანობა მაღალია', '88 % · ფანჯრები გაიღო', 'გუშინ'],
    ['warn', 'კავშირი გაწყდა', '12 წუთით', 'გუშინ'],

  $('alertList').innerHTML = ALERTS.map(([s, t, d, tm]) => `<div class="card alert"><span class="sev ${s}">${SEV[s]}</span><div><b>${t}</b><span>${d}</span></div><time>${tm}</time></div>`).join('');

  /* ---------------- settings ---------------- */
  const CHECK = '<svg class="chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  function renderSettings() {
    $('cropList').innerHTML = Object.entries(CROPS).map(([k, c]) => `<button class="row" type="button" role="radio" aria-checked="${k === S.crop}" data-crop="${k}"><span class="k">${c.name}</span>${CHECK}</button>`).join('');
    $('typeSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.type === S.type)));
  }
  $('cropList').addEventListener('click', e => { const b = e.target.closest('[data-crop]'); if (!b) return;
    S.crop = b.dataset.crop; GH[S.gh].crop = S.crop; autoLevels(); renderAll(); toast(`${crop().name} · პარამეტრები დაყენდა`); });
  seg('typeSeg', 'type', v => { S.type = v; GH[S.gh].type = v; renderAll(); });
  document.querySelectorAll('.switch').forEach(s => s.addEventListener('click', () => s.setAttribute('aria-checked', String(s.getAttribute('aria-checked') !== 'true'))));

  /* ---------------- greenhouse switcher ---------------- */
  $('ghBtn').addEventListener('click', () => {
    $('overlay').innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-label="სათბურები"><span class="grab"></span>
      ${GH.map((g, i) => `<button class="gh-opt" type="button" role="radio" aria-checked="${i === S.gh}" data-gh="${i}">${g.name}<span>${CROPS[g.crop].name}</span></button>`).join('')}
      <button class="btn soft" type="button" data-close>დახურვა</button></div>`;
  });

  /* ---------------- tabs ---------------- */
  function go(tab) {
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
    document.querySelectorAll('.screen').forEach(s => (s.hidden = s.id !== 's-' + tab));
    $('main').scrollTop = 0;
    if (tab === 'alerts') $('badge').hidden = true;
    if (tab === 'history') renderHistory();
  }
  document.querySelector('nav.tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) go(t.dataset.tab); });
  document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); });

  let tt;
  function toast(msg) {
    clearTimeout(tt); device.querySelectorAll('.toast').forEach(x => x.remove());
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; device.append(t);
    tt = setTimeout(() => t.remove(), 2400);
  }

  function renderAll() { renderHome(); renderHistory(); renderSettings(); }
  autoLevels(); renderAll();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', renderAll);
})();
</script>
</body>
</html>
